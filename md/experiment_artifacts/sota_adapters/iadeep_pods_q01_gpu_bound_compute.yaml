apiVersion: v1
kind: Pod
metadata:
  name: gpu-heavy-jax-matmul
  labels:
    scheduleurm-taskset: q01-gpu-bound-compute
spec:
  schedulerName: iadeep-scheduler
  restartPolicy: Never
  containers:
  - name: workload
    image: scheduleurm/iadeep-placeholder:latest
    command: ["python", "-m", "scheduleurm_workload_adapter"]
    args: ["--workload-key", "gpu_heavy_jax_matmul", "--total-units", "2400"]
    resources:
      limits:
        cpu: "2"
        nvidia.com/gpu: "1"
