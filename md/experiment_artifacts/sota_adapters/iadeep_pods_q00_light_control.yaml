apiVersion: v1
kind: Pod
metadata:
  name: light-control-local
  labels:
    scheduleurm-taskset: q00-light-control
spec:
  schedulerName: iadeep-scheduler
  restartPolicy: Never
  containers:
  - name: workload
    image: scheduleurm/iadeep-placeholder:latest
    command: ["python", "-m", "scheduleurm_workload_adapter"]
    args: ["--workload-key", "light_control_local", "--total-units", "10000"]
    resources:
      limits:
        cpu: "1"
        nvidia.com/gpu: "0"
