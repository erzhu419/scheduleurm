apiVersion: v1
kind: Pod
metadata:
  name: cpu-heavy-local-bench
  labels:
    scheduleurm-taskset: q10-cpu-host-bound
spec:
  schedulerName: iadeep-scheduler
  restartPolicy: Never
  containers:
  - name: workload
    image: scheduleurm/iadeep-placeholder:latest
    command: ["python", "-m", "scheduleurm_workload_adapter"]
    args: ["--workload-key", "cpu_heavy_local_bench", "--total-units", "1000"]
    resources:
      limits:
        cpu: "1"
        nvidia.com/gpu: "0"
